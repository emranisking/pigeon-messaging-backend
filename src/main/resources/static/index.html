<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger - Login</title>
    <!-- Main stylesheet shared between login page and messenger app -->
    <link rel="stylesheet" href="/css/messenger.css">
</head>
<body class="auth-page">
    <!-- Auth Page Container: Gradient background container for login/register forms -->
    <div class="auth-container">
        <!-- Auth Card: White card with rounded corners containing all auth forms -->
        <div class="auth-card">
            <!-- Logo Section: Brand identity with pigeon mascot SVG and "PIGEON" text -->
            <div class="auth-logo">
                <!-- Pigeon SVG Icon: Custom illustration used as the app's mascot -->
                <svg viewBox="0 0 200 200" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="100" cy="110" rx="35" ry="45" fill="#4a5568"/>
                    <circle cx="100" cy="65" r="28" fill="#555d6e"/>
                    <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                    <circle cx="109" cy="58" r="2" fill="white"/>
                    <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                    <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                    <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                    <rect x="92" y="87" width="6" height="5" rx="1" fill="#d4a574"/>
                    <path d="M 94 87 Q 94 85 96 85 Q 98 85 98 87" stroke="#d4a574" stroke-width="1" fill="none"/>
                    <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                    <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                    <ellipse cx="70" cy="110" rx="15" ry="30" fill="#3a4556" opacity="0.8"/>
                    <ellipse cx="130" cy="110" rx="15" ry="30" fill="#3a4556" opacity="0.8"/>
                    <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                </svg>
                <!-- Brand Name -->
                <h1>PIGEON</h1>
            </div>

            <!-- Login Form: Primary authentication form (shown by default) -->
            <form id="loginForm" class="auth-form active">
                <h2>Log In</h2>
                <!-- Username Input: Email or username for login, supports autocomplete for browser password managers -->
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                </div>
                <!-- Password Input: Secure password field with browser autocomplete support -->
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                </div>
                <!-- Error Display: Shows login errors (invalid credentials, network errors, etc.) -->
                <div id="loginError" class="form-error"></div>
                <!-- Submit Button: Triggers login via auth.js, shows loading spinner during request -->
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Log In</span>
                    <!-- Loading spinner appears during API request; hidden by default -->
                    <span class="btn-loader" style="display:none;"></span>
                </button>
                <!-- Form Toggle Link: Switches to register form when clicked -->
                <div class="auth-switch">
                    Don't have an account? <a href="#" id="showRegister">Create one</a>
                </div>
            </form>

            <!-- Registration Form: Account creation form (hidden by default, toggled via showRegister link) -->
            <form id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <!-- Username Input: New username for registration (3-50 chars), validated on client and server -->
                <div class="form-group">
                    <input type="text" id="registerUsername" placeholder="Username" required autocomplete="username" minlength="3" maxlength="50">
                </div>
                <!-- Password Input: New password field (minimum 6 chars), validated on client and server -->
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="Password" required autocomplete="new-password" minlength="6">
                </div>
                <!-- Confirm Password: Password verification field, must match registerPassword for successful registration -->
                <div class="form-group">
                    <input type="password" id="registerConfirm" placeholder="Confirm Password" required autocomplete="new-password">
                </div>
                <!-- Error Display: Shows registration errors (username taken, passwords don't match, etc.) -->
                <div id="registerError" class="form-error"></div>
                <!-- Submit Button: Triggers registration via auth.js, validates password match before submit -->
                <button type="submit" class="btn-primary" id="registerBtn">
                    <span class="btn-text">Sign Up</span>
                    <!-- Loading spinner appears during API request; hidden by default -->
                    <span class="btn-loader" style="display:none;"></span>
                </button>
                <!-- Form Toggle Link: Switches back to login form when clicked -->
                <div class="auth-switch">
                    Already have an account? <a href="#" id="showLogin">Log in</a>
                </div>
            </form>
        </div>
    </div>

    <!-- REST API Client Module: Provides all backend HTTP endpoints (login, register, search, etc.) -->
    <script src="/js/api.js"></script>
    <!-- Authentication Module: Handles login/register form logic, token storage, and form validation -->
    <script src="/js/auth.js"></script>
</body>
</html>
