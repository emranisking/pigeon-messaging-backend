<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger - Login</title>
    <link rel="stylesheet" href="/css/messenger.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 200 200" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Pigeon Body -->
                    <ellipse cx="100" cy="110" rx="35" ry="45" fill="#4a5568"/>
                    
                    <!-- Pigeon Head -->
                    <circle cx="100" cy="65" r="28" fill="#555d6e"/>
                    
                    <!-- Pigeon Eye (intense) -->
                    <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                    <circle cx="109" cy="58" r="2" fill="white"/>
                    
                    <!-- Pigeon Beak -->
                    <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                    
                    <!-- Gold Necklace -->
                    <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                    
                    <!-- Message Capsule -->
                    <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                    
                    <!-- Lock Icon on Capsule -->
                    <rect x="92" y="87" width="6" height="5" rx="1" fill="#d4a574"/>
                    <path d="M 94 87 Q 94 85 96 85 Q 98 85 98 87" stroke="#d4a574" stroke-width="1" fill="none"/>
                    
                    <!-- Scroll attached to capsule -->
                    <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                    <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                    
                    <!-- Wings -->
                    <ellipse cx="70" cy="110" rx="15" ry="30" fill="#3a4556" opacity="0.8"/>
                    <ellipse cx="130" cy="110" rx="15" ry="30" fill="#3a4556" opacity="0.8"/>
                    
                    <!-- Perch (wooden branch) -->
                    <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                </svg>
                <h1>PIGEON</h1>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2>Log In</h2>
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                </div>
                <div id="loginError" class="form-error"></div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Log In</span>
                    <span class="btn-loader" style="display:none;"></span>
                </button>
                <div class="auth-switch">
                    Don't have an account? <a href="#" id="showRegister">Create one</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <div class="form-group">
                    <input type="text" id="registerUsername" placeholder="Username" required autocomplete="username" minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="Password" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" id="registerConfirm" placeholder="Confirm Password" required autocomplete="new-password">
                </div>
                <div id="registerError" class="form-error"></div>
                <button type="submit" class="btn-primary" id="registerBtn">
                    <span class="btn-text">Sign Up</span>
                    <span class="btn-loader" style="display:none;"></span>
                </button>
                <div class="auth-switch">
                    Already have an account? <a href="#" id="showLogin">Log in</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
