<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="/css/messenger.css">
</head>
<body>
    <div class="messenger" id="messengerApp">
        <!-- Connection Status Bar -->
        <div class="connection-bar" id="connectionBar"></div>

        <!-- ====== SIDEBAR ====== -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Messenger</h2>
                <div class="sidebar-header-actions">
                    <button class="icon-btn" id="btnNewChat" title="New Message">
                        <!-- Compose icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btnNewGroup" title="New Group">
                        <!-- Group icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tabs for Chats and Groups -->
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="tabChats" onclick="App.switchTab('chats')">Chats</button>
                <button class="tab-btn" id="tabGroups" onclick="App.switchTab('groups')">Groups</button>
            </div>

            <div class="sidebar-search" id="sidebarSearch">
                <div class="search-input-wrap">
                    <span class="search-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search Messenger" autocomplete="off">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="conversation-list" id="conversationList">
                <div class="loading-spinner" id="convLoading"></div>
            </div>

            <div class="conversation-list" id="groupList" style="display: none;">
            </div>

            <div class="sidebar-user" id="sidebarUser">
                <div class="sidebar-user-avatar" id="userAvatar"></div>
                <span class="sidebar-user-name" id="userName"></span>
                <button class="btn-logout" id="btnLogout" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16,17 21,12 16,7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ====== CHAT PANEL ====== -->
        <div class="chat-panel" id="chatPanel">
            <!-- Empty state (no conversation selected) -->
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">
                    <svg width="36" height="36" viewBox="0 0 36 36">
                        <path d="M18 0C7.854 0 0 7.126 0 16.41c0 5.178 2.533 9.567 6.537 12.58V36l6.554-3.672c1.752.488 3.604.752 5.51.752 9.834 0 17.802-7.127 17.802-15.882C36.403 7.126 28.435 0 18 0z" fill="#0084ff"/>
                        <path d="M19.88 21.024L15.6 16.56l-8.4 4.704L16.44 11.88l4.44 4.464 8.22-4.704-9.22 9.384z" fill="#fff"/>
                    </svg>
                </div>
                <h3>Your Messages</h3>
                <p>Send private messages to a friend</p>
            </div>

            <!-- Active chat view -->
            <div id="chatView" style="display:none; flex-direction:column; height:100%;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button class="btn-back" id="btnBack">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15,18 9,12 15,6"/>
                        </svg>
                    </button>
                    <div class="chat-header-avatar" id="chatAvatar"></div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatName"></div>
                        <div class="chat-header-status" id="chatStatus">Active now</div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="messages-container" id="messagesContainer">
                    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
                        <button class="btn-load-more" id="btnLoadMore">Load older messages</button>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area">
                    <div class="chat-input-wrap">
                        <textarea class="chat-input" id="chatInput" placeholder="Aa" rows="1"></textarea>
                    </div>
                    <button class="btn-send" id="btnSend" disabled title="Send">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div class="modal-overlay" id="newChatModal">
        <div class="modal">
            <div class="modal-header">
                <h3>New Message</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <input type="text" id="modalSearchInput" placeholder="Search people..." autocomplete="off">
                </div>
                <div class="modal-user-list" id="modalUserList">
                    <div class="search-empty">Type a name to search</div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Group Modal -->
    <div class="modal-overlay" id="newGroupModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Group</h3>
                <button class="modal-close" id="groupModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <input type="text" id="groupNameInput" placeholder="Group name" autocomplete="off">
                </div>
                <div class="modal-search">
                    <input type="text" id="groupSearchInput" placeholder="Search people to add..." autocomplete="off">
                </div>
                <div class="selected-members" id="selectedMembers"></div>
                <div class="modal-user-list" id="groupUserList">
                    <div class="search-empty">Type a name to search</div>
                </div>
                <button class="btn-create-group" id="btnCreateGroup" disabled>Create Group</button>
            </div>
        </div>
    </div>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- App Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
