<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="/css/messenger.css">
</head>
<body>
    <div class="messenger" id="messengerApp">
        <!-- Connection Status Bar -->
        <div class="connection-bar" id="connectionBar"></div>

        <!-- ====== SIDEBAR ====== -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-container">
                    <svg viewBox="0 0 200 200" width="32" height="32" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                        <!-- Pigeon Body -->
                        <ellipse cx="100" cy="110" rx="35" ry="45" fill="#0a84ff"/>
                        
                        <!-- Pigeon Head -->
                        <circle cx="100" cy="65" r="28" fill="#0a84ff"/>
                        
                        <!-- Pigeon Eye (intense) -->
                        <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                        <circle cx="109" cy="58" r="2" fill="white"/>
                        
                        <!-- Pigeon Beak -->
                        <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                        
                        <!-- Gold Necklace -->
                        <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                        
                        <!-- Message Capsule -->
                        <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                        
                        <!-- Lock Icon on Capsule -->
                        <rect x="92" y="87" width="6" height="5" rx="1" fill="#d4a574"/>
                        <path d="M 94 87 Q 94 85 96 85 Q 98 85 98 87" stroke="#d4a574" stroke-width="1" fill="none"/>
                        
                        <!-- Scroll attached to capsule -->
                        <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                        <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                        
                        <!-- Wings -->
                        <ellipse cx="70" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <ellipse cx="130" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        
                        <!-- Perch (wooden branch) -->
                        <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                    </svg>
                    <h2>PIGEON</h2>
                </div>
                <div class="sidebar-header-actions">
                    <button class="icon-btn" id="btnNewChat" title="New Message">
                        <!-- Compose icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btnNewGroup" title="New Group">
                        <!-- Group icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tabs for Chats and Groups -->
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="tabChats" onclick="App.switchTab('chats')">Chats</button>
                <button class="tab-btn" id="tabGroups" onclick="App.switchTab('groups')">Groups</button>
            </div>

            <div class="sidebar-search" id="sidebarSearch">
                <div class="search-input-wrap">
                    <span class="search-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search Messenger" autocomplete="off">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="conversation-list" id="conversationList">
                <div class="loading-spinner" id="convLoading"></div>
            </div>

            <div class="conversation-list" id="groupList" style="display: none;">
            </div>

            <div class="sidebar-user" id="sidebarUser">
                <div class="sidebar-user-avatar" id="userAvatar"></div>
                <span class="sidebar-user-name" id="userName"></span>
                <button class="btn-logout" id="btnLogout" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16,17 21,12 16,7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ====== CHAT PANEL ====== -->
        <div class="chat-panel hidden" id="chatPanel">
            <!-- Empty state (no conversation selected) -->
        <!-- Empty state (no conversation selected) -->
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">
                    <svg viewBox="0 0 200 200" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                        <!-- Pigeon Body -->
                        <ellipse cx="100" cy="110" rx="35" ry="45" fill="#0a84ff"/>
                        
                        <!-- Pigeon Head -->
                        <circle cx="100" cy="65" r="28" fill="#0a84ff"/>
                        
                        <!-- Pigeon Eye (intense) -->
                        <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                        <circle cx="109" cy="58" r="2" fill="white"/>
                        
                        <!-- Pigeon Beak -->
                        <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                        
                        <!-- Gold Necklace -->
                        <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                        
                        <!-- Message Capsule -->
                        <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                        
                        <!-- Scroll attached to capsule -->
                        <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                        <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                        
                        <!-- Wings -->
                        <ellipse cx="70" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <ellipse cx="130" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        
                        <!-- Perch (wooden branch) -->
                        <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                    </svg>
                </div>
                <h3>Your Messages</h3>
                <p>Send private messages to a friend</p>
            </div>

            <!-- Active chat view -->
            <div id="chatView" style="display:none; flex-direction:column; height:100%;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button class="btn-back" id="btnBack">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15,18 9,12 15,6"/>
                        </svg>
                    </button>
                    <div class="chat-header-avatar" id="chatAvatar"></div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatName"></div>
                        <div class="chat-header-status" id="chatStatus">Active now</div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="messages-container" id="messagesContainer">
                    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
                        <button class="btn-load-more" id="btnLoadMore">Load older messages</button>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area">
                    <div class="chat-input-wrap">
                        <textarea class="chat-input" id="chatInput" placeholder="Aa" rows="1"></textarea>
                    </div>
                    <button class="btn-send" id="btnSend" disabled title="Send">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div class="modal-overlay" id="newChatModal">
        <div class="modal">
            <div class="modal-header">
                <h3>New Message</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <input type="text" id="modalSearchInput" placeholder="Search people..." autocomplete="off">
                </div>
                <div class="modal-user-list" id="modalUserList">
                    <div class="search-empty">Type a name to search</div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Group Modal -->
    <div class="modal-overlay" id="newGroupModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Group</h3>
                <button class="modal-close" id="groupModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <input type="text" id="groupNameInput" placeholder="Group name" autocomplete="off">
                </div>
                <div class="modal-search">
                    <input type="text" id="groupSearchInput" placeholder="Search people to add..." autocomplete="off">
                </div>
                <div class="selected-members" id="selectedMembers"></div>
                <div class="modal-user-list" id="groupUserList">
                    <div class="search-empty">Type a name to search</div>
                </div>
                <button class="btn-create-group" id="btnCreateGroup" disabled>Create Group</button>
            </div>
        </div>
    </div>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- App Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
