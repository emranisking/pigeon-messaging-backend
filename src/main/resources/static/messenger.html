<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <!-- Main stylesheet for messenger app styling and layouts -->
    <link rel="stylesheet" href="/css/messenger.css">
</head>
<body>
    <!-- Main Messenger Application Container: Root container for entire messenger app after login -->
    <div class="messenger" id="messengerApp">
        <!-- Connection Status Bar: Shows WebSocket connection status (connecting, connected, disconnected) -->
        <div class="connection-bar" id="connectionBar"></div>

        <!-- SIDEBAR SECTION: Left navigation panel showing conversations, groups, search, and user info -->
        <div class="sidebar" id="sidebar">
            <!-- Sidebar Header: Contains logo and action buttons (new message, new group) -->
            <div class="sidebar-header">
                <!-- Logo Container: Pigeon mascot SVG and brand name "PIGEON" -->
                <div class="sidebar-logo-container">
                    <!-- Pigeon SVG Icon: App mascot/branding element -->
                    <svg viewBox="0 0 200 200" width="32" height="32" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                        <ellipse cx="100" cy="110" rx="35" ry="45" fill="#0a84ff"/>
                        <circle cx="100" cy="65" r="28" fill="#0a84ff"/>
                        <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                        <circle cx="109" cy="58" r="2" fill="white"/>
                        <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                        <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                        <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                        <rect x="92" y="87" width="6" height="5" rx="1" fill="#d4a574"/>
                        <path d="M 94 87 Q 94 85 96 85 Q 98 85 98 87" stroke="#d4a574" stroke-width="1" fill="none"/>
                        <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                        <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                        <ellipse cx="70" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <ellipse cx="130" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                    </svg>
                    <!-- Brand Name Text -->
                    <h2>PIGEON</h2>
                </div>
                <!-- Sidebar Action Buttons: New chat and new group creation buttons -->
                <div class="sidebar-header-actions">
                    <!-- New Message Button: Opens modal to start new 1-on-1 conversation -->
                    <button class="icon-btn" id="btnNewChat" title="New Message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <!-- New Group Button: Opens modal to create new group chat -->
                    <button class="icon-btn" id="btnNewGroup" title="New Group">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tab Navigation: Toggle between "Chats" (1-on-1) and "Groups" views -->
            <div class="sidebar-tabs">
                <!-- Chats Tab: Shows individual conversations/DMs; active by default -->
                <button class="tab-btn active" id="tabChats" onclick="App.switchTab('chats')">Chats</button>
                <!-- Groups Tab: Shows group conversations -->
                <button class="tab-btn" id="tabGroups" onclick="App.switchTab('groups')">Groups</button>
            </div>

            <!-- Search Section: Global search to find people and start conversations -->
            <div class="sidebar-search" id="sidebarSearch">
                <!-- Search Input Wrapper: Contains search icon and input field -->
                <div class="search-input-wrap">
                    <!-- Search Icon: Visual indicator of search functionality -->
                    <span class="search-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <!-- Search Input: Type to search for users; triggers API search query -->
                    <input type="text" class="search-input" id="searchInput" placeholder="Search Conversion" autocomplete="off">
                </div>
                <!-- Search Results Dropdown: Shows matching users when search returns results -->
                <div class="search-results" id="searchResults"></div>
            </div>

            <!-- Conversations List: Scrollable list of all 1-on-1 chats, populated from API -->
            <div class="conversation-list" id="conversationList">
                <!-- Loading Spinner: Shows while conversations are being fetched from backend -->
                <div class="loading-spinner" id="convLoading"></div>
            </div>

            <!-- Groups List: Scrollable list of all group chats, hidden by default (shown on Groups tab) -->
            <div class="conversation-list" id="groupList" style="display: none;">
                <!-- Groups are populated here by app.js when switchTab('groups') is called -->
            </div>

            <!-- User Info Bar: Shows current logged-in user avatar, name, and logout button -->
            <div class="sidebar-user" id="sidebarUser">
                <!-- User Avatar: Colored circle with first letter of username -->
                <div class="sidebar-user-avatar" id="userAvatar"></div>
                <!-- User Name: Displays logged-in user's username -->
                <span class="sidebar-user-name" id="userName"></span>
                <!-- Logout Button: Clears token from localStorage and redirects to login page -->
                <button class="btn-logout" id="btnLogout" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16,17 21,12 16,7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CHAT PANEL SECTION: Main content area showing messages and input for selected conversation -->
        <div class="chat-panel hidden" id="chatPanel">
            <!-- Empty State: Shown when no conversation is selected or app first loads -->
            <div class="chat-empty" id="chatEmpty">
                <!-- Empty State Icon: Pigeon mascot displayed when chat view is empty -->
                <div class="chat-empty-icon">
                    <svg viewBox="0 0 200 200" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="100" cy="110" rx="35" ry="45" fill="#0a84ff"/>
                        <circle cx="100" cy="65" r="28" fill="#0a84ff"/>
                        <circle cx="108" cy="60" r="5" fill="#1a202c"/>
                        <circle cx="109" cy="58" r="2" fill="white"/>
                        <path d="M 115 65 L 130 63 L 115 68 Z" fill="#8b7355"/>
                        <ellipse cx="100" cy="88" rx="42" ry="8" fill="none" stroke="#d4a574" stroke-width="3"/>
                        <rect x="85" y="82" width="30" height="14" rx="7" fill="#8b7355" stroke="#d4a574" stroke-width="1.5"/>
                        <line x1="115" y1="89" x2="125" y2="92" stroke="#8b7355" stroke-width="2"/>
                        <path d="M 125 90 L 128 88 L 125 94 Z" fill="#8b7355"/>
                        <ellipse cx="70" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <ellipse cx="130" cy="110" rx="15" ry="30" fill="#0a84ff" opacity="0.8"/>
                        <rect x="40" y="145" width="120" height="8" rx="4" fill="#8b7355" stroke="#6b5345" stroke-width="1"/>
                    </svg>
                </div>
                <!-- Empty State Heading: Main text for empty state -->
                <h3>Your Messages</h3>
                <!-- Empty State Description: Helper text explaining how to start messaging -->
                <p>Send private messages to a friend</p>
            </div>

            <!-- Chat View Container: Wrapper for header, messages, and input (shown when conversation selected) -->
            <div id="chatView" style="display:none; flex-direction:column; height:100%;">
                <!-- Chat Header: Shows conversation info (avatar, name, status), back button for mobile -->
                <div class="chat-header">
                    <!-- Back Button: Returns to conversation list on small screens (mobile) -->
                    <button class="btn-back" id="btnBack">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15,18 9,12 15,6"/>
                        </svg>
                    </button>
                    <!-- Chat Avatar: User's avatar circle with first letter or initials -->
                    <div class="chat-header-avatar" id="chatAvatar"></div>
                    <!-- Chat Info: Name and online status of selected conversation -->
                    <div class="chat-header-info">
                        <!-- Chat Name: Name of user or group being messaged -->
                        <div class="chat-header-name" id="chatName"></div>
                        <!-- Chat Status: "Active now" or last seen time for the selected conversation -->
                        <div class="chat-header-status" id="chatStatus">Active now</div>
                    </div>
                </div>

                <!-- Messages Container: Scrollable area showing all messages in the conversation -->
                <div class="messages-container" id="messagesContainer">
                    <!-- Load More Button Wrapper: Pagination control at top of message history -->
                    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
                        <!-- Load More Button: Fetches older messages from API when clicked (pagination) -->
                        <button class="btn-load-more" id="btnLoadMore">Load older messages</button>
                    </div>
                    <!-- Messages: Individual message bubbles populated here by app.js -->
                </div>

                <!-- Chat Input Area: Message composition and send button -->
                <div class="chat-input-area">
                    <!-- Input Wrapper: Contains textarea with grow animation on multiple lines -->
                    <div class="chat-input-wrap">
                        <!-- Message Input Textarea: Auto-resizable textarea for message composition (max 120px height) -->
                        <textarea class="chat-input" id="chatInput" placeholder="Aa" rows="1"></textarea>
                    </div>
                    <!-- Send Button: Publishes message to WebSocket, disabled when input is empty -->
                    <button class="btn-send" id="btnSend" disabled title="Send">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- NEW MESSAGE MODAL: Dialog for starting a new 1-on-1 conversation with search -->
    <div class="modal-overlay" id="newChatModal">
        <!-- Modal Content: White card with header and search functionality -->
        <div class="modal">
            <!-- Modal Header: Title and close button -->
            <div class="modal-header">
                <!-- Modal Title -->
                <h3>New Message</h3>
                <!-- Modal Close Button: Dismisses modal and clears search -->
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <!-- Modal Body: Scrollable area with search and user list -->
            <div class="modal-body">
                <!-- Search Input: Type username to find people to start conversation with -->
                <div class="modal-search">
                    <input type="text" id="modalSearchInput" placeholder="Search people..." autocomplete="off">
                </div>
                <!-- User List: Shows search results or empty state when no search results -->
                <div class="modal-user-list" id="modalUserList">
                    <!-- Empty State Message: Shows when search box is empty or no matches found -->
                    <div class="search-empty">Type a name to search</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CREATE GROUP MODAL: Dialog for creating a new group chat with multiple members -->
    <div class="modal-overlay" id="newGroupModal">
        <!-- Modal Content: White card with header, inputs, and member selection -->
        <div class="modal">
            <!-- Modal Header: Title and close button -->
            <div class="modal-header">
                <!-- Modal Title -->
                <h3>Create Group</h3>
                <!-- Modal Close Button: Dismisses modal and clears form -->
                <button class="modal-close" id="groupModalClose">&times;</button>
            </div>
            <!-- Modal Body: Group name input, member search, selected members list -->
            <div class="modal-body">
                <!-- Group Name Input: Text field for naming the group chat -->
                <div class="modal-search">
                    <input type="text" id="groupNameInput" placeholder="Group name" autocomplete="off">
                </div>
                <!-- Member Search Input: Type username to add members to group -->
                <div class="modal-search">
                    <input type="text" id="groupSearchInput" placeholder="Search people to add..." autocomplete="off">
                </div>
                <!-- Selected Members List: Shows chips/tags of selected group members with remove option -->
                <div class="selected-members" id="selectedMembers"></div>
                <!-- User Search Results List: Shows matching users that can be added to group -->
                <div class="modal-user-list" id="groupUserList">
                    <!-- Empty State Message: Shows when search box is empty -->
                    <div class="search-empty">Type a name to search</div>
                </div>
                <!-- Create Group Button: Disabled until group name and at least 1 member selected -->
                <button class="btn-create-group" id="btnCreateGroup" disabled>Create Group</button>
            </div>
        </div>
    </div>

    <!-- EXTERNAL WEBSOCKET LIBRARIES: SockJS and STOMP for real-time messaging over WebSocket -->
    <!-- SockJS: WebSocket emulation library (fallback for browsers without native WebSocket) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <!-- STOMP: Message protocol library on top of WebSocket for pub/sub messaging patterns -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- APPLICATION SCRIPTS: Order matters - API first, then WebSocket, then main app logic -->
    <!-- REST API Client Module: Provides all backend HTTP endpoints (login, messages, groups, etc.) -->
    <script src="/js/api.js"></script>
    <!-- WebSocket Module: Manages real-time STOMP connections and message pub/sub -->
    <script src="/js/websocket.js"></script>
    <!-- Main Application Module: State management, UI rendering, event handlers, and app orchestration -->
    <script src="/js/app.js"></script>
</body>
</html>
